name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

concurrency:
  cancel-in-progress: true
  group: ci-${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  quality:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      DATABASE_URL: postgresql://resurgo_ci:synthetic_ci_password@127.0.0.1:5432/resurgo_ci
      GARAGE_ACCESS_KEY_ID: GK00000000000000000000000000000000
      GARAGE_BUCKET: resurgo-ci-private
      GARAGE_ENDPOINT: http://127.0.0.1:3900
      GARAGE_REGION: garage
      GARAGE_SECRET_ACCESS_KEY: synthetic-ci-garage-secret-not-for-production
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NODE_ENV: test
      POSTGRES_DB: resurgo_ci
      POSTGRES_PASSWORD: synthetic_ci_password
      POSTGRES_USER: resurgo_ci
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_DB: resurgo_ci
          POSTGRES_PASSWORD: synthetic_ci_password
          POSTGRES_USER: resurgo_ci
        options: >-
          --health-cmd "pg_isready -U resurgo_ci -d resurgo_ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.16.1
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
          node-version: 26.13.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Check types
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test
      - name: Validate migrations on an empty database
        run: pnpm db:validate
      - name: Build application
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser tests
        run: pnpm test:e2e
      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Scan committed content
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
