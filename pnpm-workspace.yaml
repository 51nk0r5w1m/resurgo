packages:
  - apps/*
  - packages/*

catalogMode: strict

cleanupUnusedCatalogs: true

overrides:
  esbuild@<=0.24.2: 0.25.12

minimumReleaseAgeExclude:
  - lucide-react@1.64.0
  - nodemailer@10.3.1

allowBuilds:
  esbuild: true
  unrs-resolver: true

catalog:
  "@better-auth/drizzle-adapter": 1.7.14
  "@resurgo/db": workspace:*
  "@types/nodemailer": 7.0.11
  better-auth: 1.7.14
  nodemailer: 10.3.1
  zod: 4.6.7
