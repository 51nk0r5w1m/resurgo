name: resurgo

services:
  clamav:
    image: clamav/clamav:1.5.4-debian13-slim@sha256:cce3e1a43ae2bb40e11335c52c0e1e98273b12fa3d587e617f63a6907cc4b70b
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 256
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run/clamav:size=16m,mode=0750
      - /tmp:size=64m,mode=1777
      - /var/lock:size=4m,mode=0755
      - /var/log/clamav:size=16m,mode=0750
    volumes:
      - clamav-signatures:/var/lib/clamav
    networks:
      - default
      - document-internal

  document-worker:
    build:
      context: ../..
      dockerfile: apps/document-worker/Dockerfile
    depends_on:
      clamav:
        condition: service_healthy
      garage:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GARAGE_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:?Run pnpm env:init first}
      GARAGE_BUCKET: ${GARAGE_BUCKET:?Run pnpm env:init first}
      GARAGE_ENDPOINT: http://garage:3900
      GARAGE_REGION: ${GARAGE_REGION:?Run pnpm env:init first}
      GARAGE_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:?Run pnpm env:init first}
      NODE_ENV: production
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=128m,mode=1777
    networks:
      - document-internal

  mailpit:
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - mailpit-data:/data

  postgres:
    image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run pnpm env:init first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm env:init first}
      POSTGRES_USER: ${POSTGRES_USER:?Run pnpm env:init first}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    networks:
      - default
      - document-internal

  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY_ID:?Run pnpm env:init first}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_BUCKET:?Run pnpm env:init first}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_ACCESS_KEY:?Run pnpm env:init first}
      GARAGE_LOG_FORMAT: json
      NO_COLOR: "1"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${GARAGE_PORT:-3900}:3900"
    read_only: true
    restart: unless-stopped
    secrets:
      - garage_admin_token
      - garage_metrics_token
      - garage_rpc_secret
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage/data
      - garage-meta:/var/lib/garage/meta
    networks:
      - default
      - document-internal

networks:
  document-internal:
    internal: true

secrets:
  garage_admin_token:
    file: ../../.secrets/garage_admin_token
  garage_metrics_token:
    file: ../../.secrets/garage_metrics_token
  garage_rpc_secret:
    file: ../../.secrets/garage_rpc_secret

volumes:
  clamav-signatures:
  garage-data:
  garage-meta:
  postgres-data:
  mailpit-data:
